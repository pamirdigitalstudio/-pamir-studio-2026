<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
:root{
--bg:#080d18;--panel:#101a2b;--panel2:#142238;
--blue:#20d9ed;--blue2:#168bff;--white:#f4f8ff;
--muted:#9aabc2;--border:rgba(255,255,255,.09)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Tahoma,Arial;line-height:1.8}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#06101b;font-size:23px;font-weight:bold}
.brand small{display:block;color:var(--blue);font-size:10px;letter-spacing:2px}
.menu-btn{background:var(--panel);border:1px solid var(--border);color:white;border-radius:12px;padding:7px 13px;font-size:23px}
.sidebar{width:255px;position:fixed;right:0;top:75px;bottom:0;z-index:30;background:#0b1321;border-left:1px solid var(--border);padding:20px 14px;transform:translateX(110%);transition:.3s;overflow:auto}
.sidebar.open{transform:translateX(0)}
.sidebar-title{color:var(--muted);font-size:12px;margin:10px}
.navbtn{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;color:#c4d0df;padding:12px;border-radius:12px;text-align:start;margin:4px 0}
.navbtn.active,.navbtn:hover{background:#163044;color:var(--blue)}
.navicon{width:25px;text-align:center}
.overlay{display:none;position:fixed;inset:75px 0 0;background:#0009;z-index:25}
.overlay.show{display:block}
main{max-width:1400px;margin:auto;padding:25px}
.page{display:none;animation:fade .25s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:5px 0 24px}
.page-head h1{margin:0;font-size:25px}
.page-head p{margin:3px 0;color:var(--muted);font-size:13px}
.hero{border:1px solid #20d9ed33;border-radius:25px;padding:35px;background:radial-gradient(circle at 10% 10%,#153b58,transparent 38%),linear-gradient(125deg,#111d31,#091321)}
.eyebrow{color:var(--blue);font-size:12px;letter-spacing:3px}
.hero h1{font-size:clamp(30px,5vw,55px);margin:12px 0}
.hero h1 span{color:var(--blue)}
.hero p{max-width:650px;color:#b7c6d9}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid var(--border);padding:10px 17px;border-radius:12px;color:white;background:var(--panel2);display:inline-flex;justify-content:center;align-items:center}
.btn.primary{background:linear-gradient(110deg,var(--blue),var(--blue2));color:#06121d;border:0;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px}
.card h3{margin:7px 0}
.card p{color:var(--muted);font-size:13px}
.card-icon{font-size:27px;color:var(--blue)}
.section-title{margin:30px 0 15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:#101b2b;border:1px solid var(--border);border-radius:15px;padding:14px}
.stat strong{display:block;font-size:24px;color:var(--blue)}
.stat span{font-size:12px;color:var(--muted)}
.pill{background:#102c3b;color:var(--blue);padding:4px 10px;border-radius:20px;font-size:11px}
.gallery-tools{display:flex;gap:8px;overflow:auto;padding:5px 0 15px}
.filter{white-space:nowrap;background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 15px;border-radius:25px}
.filter.active{background:var(--blue);color:#06121d}
.gallery-row{display:flex;gap:15px;overflow-x:auto;padding-bottom:15px}
.work{flex:0 0 270px;background:var(--panel);border:1px solid var(--border);border-radius:17px;overflow:hidden}
.work img{width:100%;height:175px;object-fit:cover;display:block}
.work-info{padding:13px}
.work-info small{color:var(--blue)}
.work-info h3{margin:5px 0}
.work-info p{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;color:#c6d4e5}
input,textarea,select{width:100%;padding:12px;border-radius:11px;background:#0a1423;color:white;border:1px solid var(--border);outline:none}
textarea{min-height:110px;resize:vertical}
.note{font-size:12px;color:var(--muted)}
.contact-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.footer{border-top:1px solid var(--border);margin-top:35px;padding:20px 0;text-align:center;color:var(--muted);font-size:12px}
.admin-list{display:grid;gap:10px}
.admin-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:#0a1423;border-radius:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:20px;background:#153448;color:white;padding:12px 18px;border:1px solid #20d9ed66;border-radius:12px;z-index:80;display:none;max-width:90vw}
body.light{--bg:#eef3f9;--panel:#fff;--panel2:#e5edf7;--white:#15243a;--muted:#60738d;--border:#d9e1ed}
body.light .topbar,body.light .sidebar{background:#fff}
body.light input,body.light textarea,body.light select{background:#f4f7fb;color:#15243a}
body.light .navbtn{color:#33445b}
body.light .hero{background:linear-gradient(125deg,#e3f7fc,#e9efff)}
body.light .hero p{color:#465b73}
html[dir="ltr"] .sidebar{right:auto;left:0;border-left:0;border-right:1px solid var(--border);transform:translateX(-110%)}
html[dir="ltr"] .sidebar.open{transform:translateX(0)}
@media(min-width:1000px){
.sidebar{transform:translateX(0)}
main{margin-right:255px;width:calc(100% - 255px)}
html[dir="ltr"] main{margin-right:0;margin-left:255px}
html[dir="ltr"] .sidebar{transform:translateX(0)}
.menu-btn{display:none}
}
@media(max-width:600px){
main{padding:15px}
.hero{padding:23px 18px}
.form-grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
}
</style>
</head>

let currentLang="fa";
const language=document.getElementById("language");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

function tr(key){
return T[currentLang][key] || T.fa[key] || key;
}

function setLanguage(lang){
if(!T[lang]) lang="fa";
currentLang=lang;
document.documentElement.lang=lang;
document.documentElement.dir=lang==="en"?"ltr":"rtl";
document.title="PAMIR DIGITAL STUDIO";

document.querySelectorAll("[data-i18n]").forEach(el=>{
const key=el.dataset.i18n;
el.textContent=tr(key);
});

document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
el.placeholder=tr(el.dataset.i18nPlaceholder);
});

document.querySelectorAll("[data-i18n-title]").forEach(el=>{
el.title=tr(el.dataset.i18nTitle);
});

language.value=lang;
localStorage.setItem("pamir_language",lang);

if(document.getElementById("page-admin").classList.contains("active")) renderOrders();
}

function go(name){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById("page-"+name).classList.add("active");
document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===name));
sidebar.classList.remove("open");
overlay.classList.remove("show");
window.scrollTo({top:0,behavior:"smooth"});
if(name==="admin")renderOrders();
}

document.querySelectorAll(".navbtn").forEach(b=>{
b.onclick=()=>go(b.dataset.page);
});

document.getElementById("menuBtn").onclick=()=>{
sidebar.classList.toggle("open");
overlay.classList.toggle("show");
};
overlay.onclick=()=>{
sidebar.classList.remove("open");
overlay.classList.remove("show");
};

function toast(msg){
const el=document.getElementById("toast");
el.textContent=msg;
el.style.display="block";
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>el.style.display="none",2800);
}

function sendWhatsApp(message){
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(message),"_blank");
}

function chooseService(key){
document.getElementById("serviceSelect").value=key;
go("order");
}

const serviceKeys={
logoBrand:"logoBrand",web:"webDesign",social:"socialDesign",
store:"onlineStore",uiux:"uiux",ai:"aiServices",other:"other"
};

const budgetKeys={
unknown:"budgetUnknown",under1000:"budget1",
"1000to3000":"budget2","3000to5000":"budget3",over5000:"budget4"
};

document.getElementById("orderForm").onsubmit=function(e){
e.preventDefault();
const d=new FormData(this);

const order={
name:d.get("name"),
phone:d.get("phone"),
service:d.get("service"),
budget:d.get("budget"),
details:d.get("details"),
date:new Date().toLocaleString()
};

const orders=JSON.parse(localStorage.getItem("pamir_orders")||"[]");
orders.unshift(order);
localStorage.setItem("pamir_orders",JSON.stringify(orders));

const message=
tr("orderMessage")+"\n"+
tr("name")+": "+order.name+"\n"+
tr("phoneLabel")+": "+order.phone+"\n"+
tr("serviceLabel")+": "+tr(serviceKeys[order.service]||"other")+"\n"+
tr("budgetLabel")+": "+tr(budgetKeys[order.budget]||"budgetUnknown")+"\n"+
tr("detailsLabel")+": "+order.details;

sendWhatsApp(message);
this.reset();
toast(tr("saved"));
};

const problemKeys={
technical:"technical",orderProblem:"orderProblem",
displayProblem:"displayProblem",suggestion:"suggestion",other:"other"
};

document.getElementById("reportForm").onsubmit=function(e){
e.preventDefault();
const d=new FormData(this);

const message=
tr("reportMessage")+"\n"+
tr("name")+": "+d.get("name")+"\n"+
tr("contactLabel")+": "+d.get("contact")+"\n"+
tr("typeLabel")+": "+tr(problemKeys[d.get("type")]||"other")+"\n"+
tr("descriptionLabel")+": "+d.get("details");

sendWhatsApp(message);
this.reset();
toast(tr("reportSent"));
};

function renderOrders(){
const list=document.getElementById("ordersList");
const orders=JSON.parse(localStorage.getItem("pamir_orders")||"[]");
list.innerHTML="";

if(!orders.length){
list.textContent=tr("emptyOrders");
return;
}

orders.forEach((o,i)=>{
const item=document.createElement("div");
item.className="admin-item";

const info=document.createElement("div");
const title=document.createElement("strong");
title.textContent=o.name+" — "+tr(serviceKeys[o.service]||"other");

const desc=document.createElement("p");
desc.className="note";
desc.textContent=o.phone+" | "+tr(budgetKeys[o.budget]||"budgetUnknown")+" | "+o.date;

info.append(title,desc);

const del=document.createElement("button");
del.className="btn";
del.textContent=tr("delete");

del.onclick=()=>{
const arr=JSON.parse(localStorage.getItem("pamir_orders")||"[]");
arr.splice(i,1);
localStorage.setItem("pamir_orders",JSON.stringify(arr));
renderOrders();
};

item.append(info,del);
list.append(item);
});
}

function clearOrders(){
if(confirm(tr("confirmClear"))){
localStorage.removeItem("pamir_orders");
renderOrders();
toast(tr("cleared"));
}
}

document.querySelectorAll(".filter").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
document.querySelectorAll(".work").forEach(card=>{
card.style.display=btn.dataset.filter==="all"||card.dataset.category===btn.dataset.filter?"":"none";
});
};
});

language.addEventListener("change",function(){
setLanguage(this.value);
});

document.getElementById("themeBtn").onclick=()=>{
document.body.classList.toggle("light");
localStorage.setItem("pamir_theme",document.body.classList.contains("light")?"light":"dark");
toast(tr("themeChanged"));
};

function resetSettings(){
localStorage.removeItem("pamir_language");
localStorage.removeItem("pamir_theme");
document.body.classList.remove("light");
setLanguage("fa");
toast(tr("resetDone"));
}

const savedLanguage=localStorage.getItem("pamir_language")||"fa";
setLanguage(savedLanguage);

if(localStorage.getItem("pamir_theme")==="light"){
document.body.classList.add("light");
}
</script>
</body>
 </html>
